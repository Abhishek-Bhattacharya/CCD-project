services:
  phoenixci-service:
    build:
      context: ../app
      dockerfile: Dockerfile
    image: phoenixci-service:${RELEASE_COMMIT:-latest}
    container_name: phoenixci-prod
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - RELEASE_COMMIT=${RELEASE_COMMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
