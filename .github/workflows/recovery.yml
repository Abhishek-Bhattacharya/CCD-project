name: "PhoenixCI Autonomous Recovery"

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_commit_sha:
        description: "Commit SHA to recover"
        required: true
      failed_step:
        description: "Failed step name hint"
        required: false
        default: ""
      failed_run_id:
        description: "CI workflow run ID to inspect for failure logs"
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  self-heal:
    name: "Groq Self-Healing Repair Agent"
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'failure' &&
          (
            github.event.workflow_run.event == 'push' ||
            (
              github.event.workflow_run.event == 'pull_request' &&
              github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
            )
          )
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.14"
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: "Install PhoenixCI agent dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Retrieve CI failure log"
        id: get-logs
        run: |
          mkdir -p .phoenix/logs
          if [ "$EVENT_NAME" == "workflow_run" ]; then
            CI_RUN_ID="$SOURCE_RUN_ID"
            FAILED_COMMIT="$SOURCE_COMMIT"
            gh run download "$CI_RUN_ID" -n ci-failure-logs -D .phoenix/logs/ || true
            FAILED_STEP="$(sed -n 's/^Failed Step: //p' .phoenix/logs/failure.log 2>/dev/null | head -n 1)"
          else
            FAILED_COMMIT="$INPUT_FAILED_COMMIT"
            CI_RUN_ID="$INPUT_FAILED_RUN_ID"
            FAILED_STEP="$INPUT_FAILED_STEP"
            REPAIR_BASE_BRANCH="main"
          fi

          if [[ ! "$FAILED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::A valid 40-character failed commit SHA is required."
            exit 1
          fi
          if [ "$EVENT_NAME" == "workflow_run" ] && [ "$SOURCE_EVENT" == "pull_request" ]; then
            if [ -z "$SOURCE_PR_NUMBER" ] || [ "$SOURCE_PR_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::Recovery only supports pull requests from this repository."
              exit 1
            fi
            FAILED_COMMIT="$SOURCE_PR_HEAD_SHA"
            REPAIR_BASE_BRANCH="$SOURCE_PR_HEAD_REF"
            CURRENT_PR_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR_NUMBER" --jq '.head.sha')"
            if [ "$CURRENT_PR_HEAD" != "$FAILED_COMMIT" ]; then
              echo "::error::The pull request head changed after the failed CI run."
              exit 1
            fi
            git fetch origin "refs/pull/$SOURCE_PR_NUMBER/head"
          else
            git fetch origin "$FAILED_COMMIT"
          fi
          if [ "$(git rev-parse FETCH_HEAD)" != "$FAILED_COMMIT" ]; then
            echo "::error::Fetched source commit does not match the failed commit."
            exit 1
          fi
          if [[ ! "$CI_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Provide a valid failed_run_id when manually starting recovery."
            exit 1
          fi

          FAILED_STEP="$(printf '%s' "$FAILED_STEP" | tr -cd '[:alnum:]_. -' | cut -c1-100)"
          if [ -z "$FAILED_STEP" ]; then
            FAILED_STEP="unknown"
          fi
          echo "FAILED_COMMIT=$FAILED_COMMIT" >> $GITHUB_ENV
          echo "FAILED_STEP=$FAILED_STEP" >> $GITHUB_ENV
          echo "REPAIR_BASE_BRANCH=$REPAIR_BASE_BRANCH" >> $GITHUB_ENV
          WORKTREE="$GITHUB_WORKSPACE/.phoenix/worktrees/$GITHUB_RUN_ID"
          mkdir -p "$(dirname "$WORKTREE")"
          git worktree add --detach "$WORKTREE" "$FAILED_COMMIT"
          echo "FAILED_WORKTREE=$WORKTREE" >> $GITHUB_ENV

          gh run view "$CI_RUN_ID" --log-failed > .phoenix/logs/ci-run.log
          if [ ! -s .phoenix/logs/ci-run.log ]; then
            echo "::error::No failed-step logs were returned for CI run $CI_RUN_ID."
            exit 1
          fi

          printf 'Failed Step: %s\n' "$FAILED_STEP" > .phoenix/logs/failure.log
          cat .phoenix/logs/ci-run.log >> .phoenix/logs/failure.log
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          SOURCE_PR_HEAD_REF: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
          SOURCE_PR_REPOSITORY: ${{ github.event.workflow_run.pull_requests[0].head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_FAILED_COMMIT: ${{ github.event.inputs.failed_commit_sha }}
          INPUT_FAILED_RUN_ID: ${{ github.event.inputs.failed_run_id }}
          INPUT_FAILED_STEP: ${{ github.event.inputs.failed_step }}

      - name: "Execute PhoenixCI Autonomous Repair"
        id: run-agent
        run: |
          python "$GITHUB_WORKSPACE/agent/cli.py" recover \
            --commit "$FAILED_COMMIT" \
            --log-file ".phoenix/logs/failure.log" \
            --failed-step "$FAILED_STEP" \
            --run-id "$GITHUB_RUN_ID" \
            --base-branch "$REPAIR_BASE_BRANCH" \
            --repo-root "$FAILED_WORKTREE" \
            --policy-path "$GITHUB_WORKSPACE/config/repair-policy.yaml" \
            --skip-local-verification
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          LLM_MODE: ${{ secrets.GROQ_API_KEY != '' && 'live' || 'mock' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRE_HUMAN_APPROVAL: ${{ vars.REQUIRE_HUMAN_APPROVAL || 'true' }}
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED || 'false' }}

      - name: "Collect recovery state and remove worktree"
        if: always()
        run: |
          if [ -n "$FAILED_WORKTREE" ] && [ -d "$FAILED_WORKTREE/.phoenix" ]; then
            mkdir -p .phoenix
            cp -a "$FAILED_WORKTREE/.phoenix/." .phoenix/
          fi
          if [ -n "$FAILED_WORKTREE" ] && [ -d "$FAILED_WORKTREE" ]; then
            git worktree remove --force "$FAILED_WORKTREE"
          fi

      - name: "Upload Audit Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenixci-audit-trail
          path: |
            .phoenix/audit.jsonl
            .phoenix/incidents.json
          retention-days: 14
