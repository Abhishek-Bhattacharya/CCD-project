name: "PhoenixCI Autonomous Recovery"

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_commit_sha:
        description: "Commit SHA to recover"
        required: true
      failed_step:
        description: "Failed step name hint"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

jobs:
  self-heal:
    name: "Groq Self-Healing Repair Agent"
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.14"
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: "Install PhoenixCI agent dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Retrieve CI failure log"
        id: get-logs
        run: |
          mkdir -p .phoenix/logs
          # If triggered by workflow_run, download artifact using GitHub CLI
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            gh run download ${{ github.event.workflow_run.id }} -n ci-failure-logs -D .phoenix/logs/ || true
            echo "FAILED_COMMIT=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV
          else
            echo "FAILED_COMMIT=${{ github.event.inputs.failed_commit_sha }}" >> $GITHUB_ENV
          fi

          if [ ! -f .phoenix/logs/failure.log ]; then
            echo "[!] No artifact log found. Fetching raw run logs via gh..."
            gh run view ${{ github.event.workflow_run.id || github.run_id }} --log-failed > .phoenix/logs/failure.log || echo "Mock failure log" > .phoenix/logs/failure.log
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "Execute PhoenixCI Autonomous Repair"
        id: run-agent
        run: |
          python agent/cli.py recover \
            --commit "${{ env.FAILED_COMMIT }}" \
            --log-file ".phoenix/logs/failure.log" \
            --failed-step "${{ github.event.inputs.failed_step || '' }}" \
            --run-id "${{ github.run_id }}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          LLM_MODE: ${{ secrets.GROQ_API_KEY != '' && 'live' || 'mock' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRE_HUMAN_APPROVAL: ${{ vars.REQUIRE_HUMAN_APPROVAL || 'true' }}
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED || 'false' }}

      - name: "Upload Audit Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenixci-audit-trail
          path: |
            .phoenix/audit.jsonl
            .phoenix/incidents.json
          retention-days: 14
